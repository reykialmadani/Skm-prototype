<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Draf Tersimpan — Enumerator SKM</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../../assets/js/data.js"></script>
</head>
<body class="public-body">
  
  <div style="max-width: 500px; margin: 0 auto; min-height: 100vh; background: var(--color-bg); display: flex; flex-direction: column; border-left: 1px solid var(--color-border); border-right: 1px solid var(--color-border);">
    
    <header style="padding: 16px 20px; background: var(--color-bg); border-bottom: 1px solid var(--color-border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 36px; z-index: 100;">
      <a href="./dashboard.html" style="color: var(--color-text);"><i data-lucide="arrow-left" style="width:20px;"></i></a>
      <div style="font-weight: 700; font-size: 15px;">Draf Tersimpan Lokal</div>
      <span class="badge badge-warning">1 Draf</span>
    </header>

    <main style="padding: 20px; flex: 1;">
      <p style="font-size:12px; color:var(--color-text-muted); margin-bottom:16px;">
        Berikut draf wawancara offline yang tersimpan di memori lokal HP kamu. Lanjutkan pengisian atau hapus draf:
      </p>

      <div id="draftListContainer">
        <div class="skm-card" style="padding:16px; margin-bottom:12px; border-left:4px solid var(--color-warning);">
          <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
            <strong style="font-size:14px;">Bpk. Hendra Gunawan</strong>
            <span style="font-size:11px; color:var(--color-text-muted);">22 Sep, 14:15</span>
          </div>
          <div style="font-size:12px; color:var(--color-text-muted); margin-bottom:8px;">
            Survei Kepuasan Layanan KTP & KK 2026
          </div>

          <div style="display:flex; align-items:center; gap:8px; margin-bottom:14px;">
            <div class="progress-bar-container" style="flex:1;">
              <div class="progress-bar-fill" style="width:60%;"></div>
            </div>
            <span style="font-weight:700; font-size:11px;">60% Selesai</span>
          </div>

          <div style="display:flex; gap:8px;">
            <a href="./form.html" class="btn btn-primary btn-sm" style="flex:1;">
              <i data-lucide="edit-3" style="width:14px;"></i> Lanjutkan Isi
            </a>
            <button class="btn btn-outline btn-sm" style="color:var(--color-danger);" onclick="deleteDraft(this)">
              <i data-lucide="trash-2" style="width:14px;"></i> Hapus
            </button>
          </div>
        </div>
      </div>

    </main>

  </div>

  <script src="../../assets/js/main.js"></script>
  <script>
    function deleteDraft(btn) {
      btn.closest('.skm-card').remove();
      showToast('Draf berhasil dihapus', 'info');
      document.getElementById('draftListContainer').innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon"><i data-lucide="inbox"></i></div>
          <div class="empty-state-title">Belum Ada Draf Tersimpan</div>
          <div class="empty-state-sub">Semua draf wawancara offline akan muncul di halaman ini.</div>
        </div>
      `;
      lucide.createIcons();
    }
  </script>
</body>
</html>
