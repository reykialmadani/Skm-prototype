<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Password — Prototype Website SKM</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../assets/js/data.js"></script>
</head>
<body class="public-body" style="display:flex; align-items:center; justify-content:center; padding:20px;">

  <div class="skm-card" style="width: 100%; max-width: 440px; padding: 36px 32px; box-shadow: var(--shadow-lg);">
    
    <div style="text-align: center; margin-bottom: 24px;">
      <div style="width: 50px; height: 50px; background: var(--color-surface); color: var(--color-primary-dark); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px;">
        <i data-lucide="key-round" style="width:24px; height:24px;"></i>
      </div>
      <h2 style="font-size: 20px; font-weight: 700; color: var(--color-text);">Atur Ulang Kata Sandi</h2>
      <p style="font-size: 13px; color: var(--color-text-muted); margin-top: 4px;">
        Masukkan email terdaftar kamu. Kami akan mengirimkan tautan reset password.
      </p>
    </div>

    <form id="forgotForm" onsubmit="handleForgotSubmit(event)">
      <div class="form-group">
        <label for="emailReset">Alamat Email Terdaftar</label>
        <input type="email" id="emailReset" class="form-control" placeholder="contoh: user@instansi.go.id" required>
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top:10px;">
        Kirim Tautan Reset Password
      </button>
    </form>

    <div style="text-align: center; margin-top: 20px;">
      <a href="./login.html" style="font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;">
        <i data-lucide="arrow-left" style="width:16px; height:16px;"></i> Kembali ke Login
      </a>
    </div>

  </div>

  <script src="../assets/js/main.js"></script>
  <script>
    function handleForgotSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('emailReset').value;
      showToast(`Tautan reset telah dikirim ke ${email} (Simulasi)`, 'success');
      setTimeout(() => {
        window.location.href = './login.html';
      }, 1500);
    }
  </script>
</body>
</html>
